services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: gr8r_studio
            POSTGRES_USER: gr8r
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U gr8r -d gr8r_studio"]
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres-data:
    redis-data:
